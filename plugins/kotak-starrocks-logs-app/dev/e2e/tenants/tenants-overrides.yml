# What the Loki data sources do not hold: level source, trace regex where Loki has no derived field, patterns.
default:
  level: { source: column }
app_1961_observability:
  level: { source: message }
  trace: { regex: 'traceid=([0-9a-f]{32})', tempoUid: e2e-tempo-obs }
  patterns:
    - { name: Request completed, like: '%msg="request completed"%' }
    - { name: Upstream timed out, like: '%upstream timed out%' }
    - { name: Connection refused, regex: 'Connection refused to [a-z0-9-]+:[0-9]+' }
    - { name: Health check, like: '%/healthz%' }
app_01996_frontlineplatforms_cmm:
  patterns:
    - { name: Order created, like: '%created order%' }
    - { name: Payment failed, regex: 'payment (declined|failed)' }
